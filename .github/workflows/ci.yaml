name: "Workflow 1"

on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore DesafioPicPay.sln

      - name: Build Solution
        run: dotnet build DesafioPicPay.sln -c Release --no-restore

  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      
      - name: Restore Dependencies
        run: dotnet restore DesafioPicPay.sln

      - name: Run Unit Tests
        run: dotnet test DesafioPicPay.Tests
  
  mutation-testing:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker Mutator
        run: dotnet stryker