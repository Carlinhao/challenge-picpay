name: Execute Mutation Tests

on:
  workflow_run:
    workflows: ["Workflow 1"]
    types:
      - completed

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore DesafioPicPay.sln

      - name: Build Solution
        run: dotnet build DesafioPicPay.sln -c Release --no-restore

  mutation-testing:
    name: Run Mutation Tests
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Run Stryker Mutator
        run: dotnet stryker
