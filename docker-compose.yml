version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: teste_postgre
    #hostname: local
    environment:
      - POSTGRES_DB=DB01
      - POSTGRES_USER=app01
      - POSTGRES_PASSWORD=321ca
    ports:
      - "5432:5432"
    networks: 
      - red
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: teste
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672" # Porta padrão do RabbitMQ
      - "15672:15672" # Porta da interface web de gerenciamento do RabbitMQ
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - red

  postgres_ui:
        image: dpage/pgadmin4:8.9
        environment:
            - PGADMIN_DEFAULT_EMAIL=teste@teste.com
            - PGADMIN_DEFAULT_PASSWORD=321ca
        volumes: 
            - pgadmin_data:/var/lib/pgadmin    
        ports: 
            - 80:80
        networks: 
            - red

  desafiopicpay-api:
      image: desafiopicpay-api
      container_name: api
      environment:
          - ASPNETCORE_URLS=http://0.0.0.0:5001
          - ASPNETCORE_ENVIRONMENT=Development
      build:
        context: .
        dockerfile: DesafioPicPay.Api/Dockerfile
      ports:
        - 5000:5001
      networks: 
        - red
      depends_on:             
        - postgres

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  pgadmin_data:
    driver: local

networks: 
  red:
    driver: bridge